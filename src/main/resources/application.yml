spring:
  application:
    name: crud.app
  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: dev
    password: password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: "classpath:/db/changelog/change-log.yaml"

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /docs
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /docs-json

app:
  security:
    admin:
      password: ${ADMIN_PASSWORD}
      email: ${ADMIN_EMAIL}
